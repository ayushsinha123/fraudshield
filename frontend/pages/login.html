<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="FraudShield Login"
    >

    <title>FraudShield — Login</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body data-page="login" data-page-title="Login">

    <main class="login-page">

        <section class="login-card">

            <!-- Brand -->
            <div class="login-brand">

                <img
                    src="../assets/icons/shield.svg"
                    alt=""
                    class="login-brand__logo"
                    width="48"
                    height="48"
                >

                <div>
                    <h1 class="login-brand__title">
                        FraudShield
                    </h1>

                    <p class="login-brand__subtitle">
                        Fraud Detection & Protection
                    </p>
                </div>

            </div>


            <!-- Heading -->
            <div class="login-header">

                <h2>
                    Welcome back
                </h2>

                <p>
                    Sign in to continue protecting your account.
                </p>

            </div>


            <!-- Login form -->
            <form
                class="login-form"
                id="login-form"
            >

                <div class="login-form__group">

                    <label for="login-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="login-form__group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div class="login-form__options">

                    <label class="login-remember">

                        <input
                            type="checkbox"
                            id="remember-me"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <button
                        type="button"
                        class="login-forgot"
                        id="forgot-password-btn"
                    >
                        Forgot password?
                    </button>

                </div>


                <button
                    type="submit"
                    class="login-submit"
                >
                    Sign In
                </button>

            </form>


            <!-- Security message -->
            <div class="login-security">

                <span class="login-security__icon">
                    🛡
                </span>

                <p>
                    Your security matters. Never share your password,
                    OTP, or banking credentials with anyone.
                </p>

            </div>

        </section>


        <p class="login-footer">
            © 2026 FraudShield. All rights reserved.
        </p>

    </main>


    <script src="../js/login.js"></script>

</body>

</html>
